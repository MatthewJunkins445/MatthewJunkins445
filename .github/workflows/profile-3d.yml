name: GitHub-Profile-3D-Contrib

on:
  schedule: # 02:00 ET == 06:00 UTC
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    name: generate-github-profile-3d-contrib
    steps:
      - uses: actions/checkout@v5

      # Two views, both reset on their own because the range is worked out on
      # every run: the month view starts empty on the 1st, the year view on Jan 1.
      - name: Work out this month and this year (UTC)
        run: |
          echo "YEAR=$(date -u +%Y)" >> "$GITHUB_ENV"
          echo "MONTH_FROM=$(date -u +%Y-%m-01)" >> "$GITHUB_ENV"
          echo "MONTH_TO=$(date -u -d "$(date -u +%Y-%m-01) +1 month -1 day" +%Y-%m-%d)" >> "$GITHUB_ENV"
          # Same colors for both views; only the output file name differs.
          jq '.fileName = "profile-3d-year.svg"'  .github/profile-3d-settings.json > "$RUNNER_TEMP/year.json"
          jq '.fileName = "profile-3d-month.svg"' .github/profile-3d-settings.json > "$RUNNER_TEMP/month.json"

      - name: Year view (Jan 1 - Dec 31)
        uses: yoshi389111/github-profile-3d-contrib@v0.9.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
          SETTING_JSON: ${{ runner.temp }}/year.json
          YEAR: ${{ env.YEAR }}

      # The action has no month range and draws bars too small for 5 weeks, so
      # run the same pinned release with .github/scripts/patch_3d_contrib.py applied.
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Month view (1st - last day of this month)
        run: |
          git clone --quiet --depth 1 --branch v0.9.3 \
            https://github.com/yoshi389111/github-profile-3d-contrib.git "$RUNNER_TEMP/p3d"
          python3 .github/scripts/patch_3d_contrib.py "$RUNNER_TEMP/p3d/dist/index.js"
          node "$RUNNER_TEMP/p3d/dist/index.js"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
          SETTING_JSON: ${{ runner.temp }}/month.json
          CONTRIB_FROM: ${{ env.MONTH_FROM }}
          CONTRIB_TO: ${{ env.MONTH_TO }}
          # Bigger bars, placed in the space left of the radar chart.
          CONTRIB_CELLS: "22"
          CONTRIB_OFFSET_X: "480"
          CONTRIB_OFFSET_Y: "350"

      - name: Build languages chart
        run: python3 .github/scripts/languages.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}

      - name: Commit & Push
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add -A .
          if git commit -m "chore: regenerate 3D contribution graphs"; then
            git push
          fi
